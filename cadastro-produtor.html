<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtor</title>
</head>
<body>

    <a href="#conteudo" class="pular">Pular para o conteúdo</a>

    <header class="cabecalho-site">
        <h1>AgroFeira</h1>
        <nav aria-label="Principal">
            <ul class="menu">
                <li><a href="index.html">Início</a></li>
                <li><a href="safra.html">Safra</a></li>
                <li><a href="cadastro-produtor.html" aria-current="page">Cadastro de produtor</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main id="conteudo">
        <h2>Cadastro de Produtor</h2>

        <form class="formulario-cadastro">
            <fieldset>
                <legend>Quem é você</legend>
                
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" autocomplete="tel">

                <label for="caf">Número do CAF</label>
                <input type="text" id="caf" name="caf">

                <label for="cep">CEP da propriedade</label>
                <input type="text" id="cep" name="cep" inputmode="numeric" pattern="\d{5}-?\d{3}" aria-describedby="ajuda-cep">
                <span id="ajuda-cep">Formato: 00000-000</span>
            </fieldset>

            <fieldset>
                <legend>O que você vende</legend>

                <label for="produto">Produto principal</label>
                <select id="produto" name="produto" required>
                    <option value="">Escolha um produto</option>
                    <option value="mandioca">Mandioca</option>
                    <option value="banana">Banana-prata</option>
                    <option value="acai">Açaí</option>
                    <option value="pimenta">Pimenta-do-reino</option>
                    <option value="cupuacu">Cupuaçu</option>
                    <option value="alface">Alface</option>
                </select>

                <label for="quantidade">Quantidade por semana</label>
                <input type="number" id="quantidade" name="quantidade" min="1" max="500" step="1" required>

                <label for="data">Começa a entregar em</label>
                <input type="date" id="data" name="data">
            </fieldset>

            <fieldset>
                <legend>Como entrega</legend>
                <input type="radio" id="leva" name="entrega" value="leva">
                <label for="leva">Leva à feira</label>
                
                <input type="radio" id="retira" name="entrega" value="retira">
                <label for="retira">A feira retira na propriedade</label>
            </fieldset>

            <label for="observacao">Observação</label>
            <textarea id="observacao" name="observacao" rows="3"></textarea>

            <input type="checkbox" id="aceite" name="aceite" required>
            <label for="aceite">Li e aceito as regras da feira</label>

            <button type="submit">Enviar cadastro</button>
        </form>

        <!-- Região de status vazia -->
        <p role="status"></p>
    </main>

    <footer class="rodape-site">
        <p>&copy; 2026 AgroFeira. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
